{% extends 'tasks/base.html' %}
{% block title %}Delete task{% endblock %}
{% block content %}
<h1 class="matrix-title"><b>DELETE_TASK</b><span class="cursor">_</span></h1>
<div class="center-column">
	
	<p>Are you sure you want to delete "{{ item }}"?</p>
	<a class="btn btn-info" href="{% url 'list' %}">Cancel</a>
	<form method="POST" action="">
		{% csrf_token %}
		<input class="btn btn-danger" type="submit" name="confirm">
	</form>
</div>
{% endblock %}
